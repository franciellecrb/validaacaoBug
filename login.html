<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | QA Stores</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/storage.js" defer></script>
    <script src="js/auth.js" defer></script>
</head>
<body>
<header>
    <div class="logo">
        <a href="index.html">QA <span>Stores</span></a>
    </div>
    <nav>
        <a href="index.html">Início</a>
        <a href="produtos.html">Produtos</a>
        <a href="cadastro.html">Criar Conta</a>
        <a href="carrinho.html">🛒
            <span id="cart-count">0</span>
        </a>
    </nav>
</header>
<main class="login-page">
    <section class="login-box">
        <h1>Entrar</h1>
        <p>Faça login para acessar sua conta.</p>
        <form id="loginForm">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="Digite seu e-mail" autocomplete="email">
            </div>
            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha" autocomplete="current-password">
            </div>
            <div class="options">
                <label>
                    <input type="checkbox" id="remember">
                    Lembrar-me
                </label>
                <a href="#">Esqueci minha senha</a>
            </div>
            <button type="submit" class="btn">Entrar</button>
            <a href="cadastro.html" class="btn-outline">Criar uma conta</a>
        </form>
    </section>
</main>
<footer>
    <p>© 2026 QA Stores - Todos os direitos reservados.</p>
</footer>
</body>
</html>
