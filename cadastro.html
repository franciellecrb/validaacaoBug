<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta | QA Stores</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/storage.js" defer></script>
    <script src="js/auth.js" defer></script>
</head>
<body>
<header>
    <div class="logo">
        <a href="index.html">QA <span>Stores</span></a>
    </div>
    <nav>
        <a href="index.html">Início</a>
        <a href="produtos.html">Produtos</a>
        <a href="login.html">Entrar</a>
        <a href="carrinho.html">🛒
            <span id="cart-count">0</span>
        </a>
    </nav>
</header>
<main class="register-page">
    <section class="register-box">
        <h1>Criar Conta</h1>
        <p>Preencha os dados abaixo para criar sua conta.</p>
        <form id="registerForm">
            <div class="input-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" placeholder="Digite seu nome">
            </div>
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="Digite seu e-mail">
            </div>
            <div class="input-group">
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" placeholder="(31) 99999-9999">
            </div>
            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha">
            </div>
            <div class="input-group">
                <label for="confirmarSenha">Confirmar Senha</label>
                <input type="password" id="confirmarSenha" placeholder="Repita sua senha">
            </div>            
            <button  type="submit" class="btn">Criar Conta</button>
        </form>
        <div class="separator">
            <span>Já possui uma conta?</span>
        </div>
        <a href="login.html" class="btn-outline"> Fazer Login</a>
    </section>
</main>
<footer>
    <p>© 2026 QA Stores - Todos os direitos reservados.</p>
</footer>
</body>
</html>
