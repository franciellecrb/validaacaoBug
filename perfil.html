<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Conta | QA Stores</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/storage.js" defer></script>
    <script src="js/perfil.js" defer></script>
</head>
<body>
<header>
    <div class="logo">
        <a href="index.html">QA <span>Stores</span></a>
    </div>
    <nav>
        <a href="index.html">Início</a>
        <a href="produtos.html">Produtos</a>
        <a href="carrinho.html">🛒
            <span id="cart-count">0</span>
        </a>
        <a href="login.html" id="logout">Sair</a>
    </nav>
</header>
<main class="profile-page">
    <section class="profile-header">
        <div class="profile-avatar">
            <img src="https://ui-avatars.com/api/?name=QA+Stores&background=667A4F&color=ffffff&size=150" alt="Foto do usuário">
        </div>
        <div class="profile-info">
            <h1 id="userName">Usuário</h1>
            <p id="userEmail">usuario@email.com</p>
        </div>
    </section>
    <section class="profile-content">
        <div class="profile-card">
            <h2>Meus Dados</h2>
            <form id="profileForm">
                <div class="input-group">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome">
                </div>
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email">
                </div>
                <div class="input-group">
                    <label for="telefone"> Telefone</label>
                    <input type="text" id="telefone">
                </div>
                <button type="submit" class="btn">Salvar Alterações</button>
            </form>
        </div>
        <div class="profile-card">
            <h2>Alterar Senha</h2>
            <form id="passwordForm">
                <div class="input-group">
                    <label for="senhaAtual">Senha Atual</label>
                    <input type="password" id="senhaAtual">
                </div>
                <div class="input-group">
                    <label for="novaSenha">Nova Senha</label>
                    <input type="password" id="novaSenha">
                </div>
                <div class="input-group">
                    <label for="confirmarSenha">Confirmar Nova Senha</label>
                    <input type="password" id="confirmarSenha">
                </div>
                <button type="submit" class="btn">Alterar Senha</button>
            </form>
        </div>
        <div class="profile-card">
            <h2>Últimos Pedidos</h2>
            <table class="orders-table">
                <thead>
                    <tr>
                        <th>Pedido</th>
                        <th>Data</th>
                        <th>Total</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="ordersTable">
                    <tr>
                        <td>#1001</td>
                        <td>15/07/2026</td>
                        <td>R$ 2.499,90</td>
                        <td>Entregue</td>
                    </tr>
                    <tr>
                        <td>#1002</td>
                        <td>22/07/2026</td>
                        <td>R$ 349,90</td>
                        <td>Em transporte</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
<footer>
    <p>© 2026 QA Stores - Todos os direitos reservados.</p>
</footer>
</body>
</html>
